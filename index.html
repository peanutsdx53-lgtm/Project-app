<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05070b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="YokaiBattlefield"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>YokaiBattlefield D12</title>
<style>
:root{--gold:#d6b778;--gold2:#f0dca9;--paper:#efe5d0;--muted:#aa9e88;--line:rgba(214,183,120,.28)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}.game{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;background:#07101b;border:1px solid rgba(214,183,120,.20);isolation:isolate;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.scene{position:absolute;inset:0;z-index:0;overflow:hidden}.world{position:absolute;inset:-3%;opacity:0;transition:opacity .68s ease;transform:scale(1.025);pointer-events:none}.world.active{opacity:1;animation:worldDrift 16s ease-in-out infinite alternate}.neutral{background:radial-gradient(circle at 70% 24%,rgba(91,120,160,.28),transparent 22%),radial-gradient(circle at 62% 56%,rgba(218,170,85,.10),transparent 8%),linear-gradient(145deg,#0c1420 0%,#07101b 48%,#020407 100%)}.kanto{background:radial-gradient(circle at 68% 42%,rgba(225,161,102,.18),transparent 18%),radial-gradient(circle at 78% 22%,rgba(141,64,69,.18),transparent 22%),linear-gradient(145deg,#101722,#09111a 52%,#030609)}.eastwest{background:radial-gradient(circle at 40% 42%,rgba(104,155,207,.20),transparent 22%),radial-gradient(circle at 70% 54%,rgba(219,178,106,.11),transparent 16%),linear-gradient(145deg,#0a1725,#07101b 52%,#020508)}.western{background:radial-gradient(circle at 73% 30%,rgba(151,70,143,.22),transparent 22%),radial-gradient(circle at 60% 58%,rgba(208,87,90,.11),transparent 14%),linear-gradient(145deg,#161020,#09101a 52%,#030408)}.mist{position:absolute;inset:-15%;opacity:.16;background:radial-gradient(ellipse at 18% 70%,rgba(225,232,240,.26),transparent 25%),radial-gradient(ellipse at 70% 50%,rgba(174,193,214,.15),transparent 28%),radial-gradient(ellipse at 90% 75%,rgba(211,224,237,.17),transparent 22%);animation:mist 18s ease-in-out infinite alternate;pointer-events:none}.glow{position:absolute;inset:0;opacity:.32;background:radial-gradient(circle at 61% 47%,rgba(235,196,121,.12),transparent 6%),radial-gradient(circle at 76% 24%,rgba(147,170,207,.10),transparent 18%);animation:glow 6.5s ease-in-out infinite;pointer-events:none}@keyframes worldDrift{to{transform:scale(1.04) translate3d(.35%,-.22%,0)}}@keyframes mist{from{transform:translate3d(-1.8%,.35%,0);opacity:.12}to{transform:translate3d(1.6%,-.3%,0);opacity:.20}}@keyframes glow{50%{opacity:.43}}.home-ui{position:absolute;inset:0;z-index:3;transition:opacity .22s ease}.copy{position:absolute;left:6.5%;top:13%;width:34%;opacity:0;transform:translateY(6px);transition:.3s ease}.game.has .copy{opacity:1;transform:none}h1,.panel-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500}.copy h1{font-size:clamp(28px,4.2vw,64px);letter-spacing:.09em;margin:0 0 12px;white-space:nowrap}.sub{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(12px,1.5vw,22px);letter-spacing:.12em;color:#d8c9ad;margin:0 0 14px}.line{width:90%;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:8px 0 12px}.mode-open{border:0;background:transparent;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.2vw,18px);letter-spacing:.12em;padding:9px 30px 9px 0;cursor:pointer}.rail{position:absolute;left:24.2%;bottom:6%;width:45.2%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mode{position:relative;overflow:hidden;height:clamp(58px,8vw,112px);min-width:0;border:1px solid rgba(214,183,120,.34);background:linear-gradient(180deg,rgba(30,40,55,.62),rgba(4,6,10,.90));font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.18vw,18px);letter-spacing:.055em;white-space:nowrap;cursor:pointer;transition:.12s ease}.mode.pressing{transform:translateY(1px) scale(.982)}.mode.sel{border-color:#f0d89c;box-shadow:inset 0 0 0 1px rgba(240,216,156,.14),0 0 14px rgba(214,183,120,.18)}.mode.sel:after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;border:1px solid rgba(240,220,175,.84);background:#0a0d13;transform:translateX(-50%) rotate(45deg);animation:sigil 2.35s ease-in-out infinite}@keyframes sigil{50%{opacity:1;box-shadow:0 0 12px rgba(233,204,144,.40)}}.mode:before,.util:before,.mode-open:before,.back:before,.tile:before,.start:before{content:"";position:absolute;top:-25%;bottom:-25%;left:-42%;width:24%;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,241,204,.68),rgba(214,183,120,.26),transparent);transform:rotate(12deg)}.fx:before{animation:sheen .32s ease-out}@keyframes sheen{18%{opacity:.72}to{left:122%;opacity:0}}.utils{position:absolute;right:3.3%;bottom:5.8%;width:21.5%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.util{position:relative;overflow:hidden;height:clamp(56px,7vw,100px);min-width:0;border:0;border-left:1px solid rgba(214,183,120,.25);background:rgba(3,5,9,.36);white-space:nowrap;font-size:clamp(9px,.75vw,12px);cursor:pointer}.util.active{color:var(--gold2);background:rgba(214,183,120,.12)}.build{position:absolute;left:1.7%;bottom:2.2%;font:clamp(8px,.72vw,11px) system-ui;color:rgba(255,255,255,.44);letter-spacing:.08em}.overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(90deg,rgba(2,4,8,.98),rgba(2,4,8,.80) 52%,rgba(2,4,8,.52));opacity:0;pointer-events:none;transition:opacity .24s ease}.overlay.open{opacity:1;pointer-events:auto}.game.overlay-open .home-ui{opacity:0;visibility:hidden;pointer-events:none}.game.overlay-open .world.active,.game.overlay-open .mist,.game.overlay-open .glow{animation-play-state:paused}.panel{position:absolute;left:6%;top:10%;width:55%;height:78%;overflow:hidden;animation:panelIn .22s ease-out}@keyframes panelIn{from{opacity:0;transform:translateX(7px)}to{opacity:1;transform:none}}.back,.tile,.start{position:relative;overflow:hidden}.back{border:1px solid rgba(214,183,120,.35);background:rgba(4,6,10,.72);padding:8px 14px;cursor:pointer}.panel-title{margin-top:18px;font-size:clamp(26px,3.4vw,52px);letter-spacing:.09em}.panel-copy{max-width:620px;font-size:clamp(10px,.95vw,14px);line-height:1.8;color:#d1c4ac}.start{margin-top:20px;border:1px solid #e5c98e;background:linear-gradient(135deg,#f0dfb7,#b18847);color:#18120a;padding:12px 28px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(14px,1.5vw,22px);cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;max-width:650px}.tile{border:1px solid var(--line);background:rgba(10,15,24,.62);padding:12px;text-align:left}.tile strong{display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(13px,1.15vw,17px);margin-bottom:5px}.tile small{color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;max-width:650px}.stat{border:1px solid var(--line);padding:14px;background:rgba(10,15,24,.62)}.stat b{display:block;font:500 clamp(22px,2.4vw,38px) "Hiragino Mincho ProN","Yu Mincho",serif;color:var(--gold2)}.stat span{font-size:11px;color:var(--muted)}.settings{margin-top:18px;max-width:650px}.setting{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 2px}.switch{width:52px;height:28px;border:1px solid rgba(214,183,120,.42);border-radius:20px;background:#111925;padding:3px;cursor:pointer}.switch i{display:block;width:20px;height:20px;border-radius:50%;background:#786b55;transition:.18s}.switch.on{background:#6e5630}.switch.on i{transform:translateX(24px);background:#f0dca9}.toast{position:absolute;z-index:20;left:50%;bottom:3%;transform:translateX(-50%) translateY(6px);opacity:0;background:rgba(4,6,10,.92);border:1px solid var(--line);padding:7px 12px;font-size:11px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
.title-screen{position:absolute;inset:0;z-index:100;overflow:hidden;background:radial-gradient(circle at 70% 26%,rgba(166,183,214,.18),transparent 18%),radial-gradient(circle at 56% 62%,rgba(214,170,87,.10),transparent 8%),linear-gradient(180deg,rgba(7,13,23,.40),rgba(3,6,11,.58)),linear-gradient(145deg,#0c1420,#07101b 48%,#020407);transition:opacity .30s ease,transform .34s ease}.title-copy{position:absolute;left:50%;top:45%;width:78%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0}.game.title-ready .title-copy,.game.title-ready .title-prompt{opacity:1}.title-logo{margin:0;font:400 clamp(42px,7vw,106px)/.95 "Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.012em;color:#ead7ac;text-shadow:0 3px 26px rgba(0,0,0,.72);white-space:nowrap}.title-rule{width:68%;height:1px;margin:18px auto 14px;background:linear-gradient(90deg,transparent,rgba(231,204,151,.72),transparent)}.title-tagline{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.18vw,18px);letter-spacing:.26em;color:rgba(236,224,199,.78);white-space:nowrap}.title-prompt{position:absolute;left:50%;bottom:10.2%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(10px,1vw,15px);letter-spacing:.20em;color:rgba(239,227,202,.78);white-space:nowrap}.title-prompt:before,.title-prompt:after{content:"";width:72px;height:1px;background:linear-gradient(90deg,transparent,rgba(231,203,147,.56))}.title-prompt:after{transform:scaleX(-1)}.title-start{position:absolute;inset:0;z-index:4;width:100%;height:100%;border:0;background:transparent;color:transparent;cursor:pointer}.title-ripple{position:absolute;left:var(--tap-x,50%);top:var(--tap-y,72%);width:24px;height:24px;border:1px solid rgba(244,219,167,.70);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.35)}.title-screen.tap .title-ripple{animation:ripple .36s ease-out}@keyframes ripple{to{opacity:0;transform:translate(-50%,-50%) scale(3)}}.title-screen.leaving{opacity:0;transform:scale(1.014);pointer-events:none}.title-screen[hidden]{display:none!important}.game.title-active .home-ui{opacity:0;visibility:hidden;pointer-events:none}.game.title-active .world.active,.game.title-active .mist,.game.title-active .glow{animation-play-state:paused}.reduce-motion .world,.reduce-motion .mist,.reduce-motion .glow,.reduce-motion .mode.sel:after{animation:none!important;transition-duration:.001ms!important}@media(prefers-reduced-motion:reduce){.world,.mist,.glow,.mode.sel:after{animation:none!important;transition-duration:.001ms!important}}@media(orientation:portrait) and (max-width:900px){.viewport{display:none}body:after{content:"横向きで指揮してください";position:fixed;inset:0;display:grid;place-items:center;background:#05070b;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.12em}}
</style></head><body><div class="viewport"><main class="game title-active" id="game"><div class="scene"><div class="world neutral active" data-world="neutral"></div><div class="world kanto" data-world="kanto"></div><div class="world eastwest" data-world="eastwest"></div><div class="world western" data-world="western"></div><div class="mist"></div><div class="glow"></div></div><section class="title-screen" id="titleScreen"><div class="title-copy"><h1 class="title-logo">Yokai Battlefield</h1><div class="title-rule"></div><div class="title-tagline">あやかしの戦場は、まだ終わっていない</div></div><div class="title-prompt">画面をタップして始める</div><div class="title-ripple"></div><button class="title-start" id="titleStart" aria-label="画面をタップして始める"></button></section><section class="home-ui"><section class="copy"><h1 id="modeTitle">関東合戦</h1><div class="line"></div><p class="sub" id="modeSub">首都圏に広がる異変</p><button class="mode-open" id="open">この合戦を見る →</button></section><nav class="rail"><button class="mode" data-world="kanto" data-title="関東合戦" data-sub="首都圏に広がる異変">関東合戦</button><button class="mode" data-world="eastwest" data-title="東西合戦" data-sub="列島を分ける二つの妖勢">東西合戦</button><button class="mode" data-world="western" data-title="西洋妖怪決戦" data-sub="境界の外から来る妖異">西洋妖怪決戦</button></nav><nav class="utils"><button class="util" data-panel="encyclopedia">妖怪図鑑</button><button class="util" data-panel="records">戦績</button><button class="util" data-panel="settings">設定</button></nav><div class="build">GH TEST D12</div></section><section class="overlay" id="overlay"><div class="panel"><button class="back" id="back">‹ ホームへ戻る</button><div id="panelBody"></div></div></section><div class="toast" id="toast"></div></main></div>
<script>
const APP_VERSION='D12';let updateBusy=false;async function checkUpdate(){if(updateBusy)return;updateBusy=true;try{const u=new URL('version.json',location.href);u.searchParams.set('_',Date.now());const r=await fetch(u,{cache:'no-store'});if(!r.ok)return;const v=await r.json();if(v.version&&v.version!==APP_VERSION){const c=new URL(location.href);c.searchParams.set('v',v.version);c.searchParams.set('_u',Date.now());location.replace(c)}}catch(e){}finally{updateBusy=false}}window.addEventListener('pageshow',()=>setTimeout(checkUpdate,250));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(checkUpdate,180)});setInterval(()=>{if(document.visibilityState==='visible')checkUpdate()},60000);
const game=document.getElementById('game'),overlay=document.getElementById('overlay'),panelBody=document.getElementById('panelBody'),modeTitle=document.getElementById('modeTitle'),modeSub=document.getElementById('modeSub'),toast=document.getElementById('toast');const defaultPrefs={sound:true,motion:true,haptic:false};let prefs={...defaultPrefs};try{prefs={...defaultPrefs,...JSON.parse(localStorage.getItem('yb-ui-prefs')||'{}')}}catch(e){}function savePrefs(){try{localStorage.setItem('yb-ui-prefs',JSON.stringify(prefs))}catch(e){}game.classList.toggle('reduce-motion',!prefs.motion)}savePrefs();let audio=null;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC({latencyHint:'interactive'})}catch(e){}function tone(f=320,d=.06,g=.014){if(!prefs.sound||!audio)return;audio.resume?.();const o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.frequency.value=f;a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(g,t+.005);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(audio.destination);o.start(t);o.stop(t+d+.02)}function haptic(ms=5){if(prefs.haptic)navigator.vibrate?.(ms)}function fx(el){if(!prefs.motion)return;el.classList.remove('fx');requestAnimationFrame(()=>{el.classList.add('fx');setTimeout(()=>el.classList.remove('fx'),360)})}let pressed=null;document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('button');if(b&&b.closest('.game')){pressed=b;b.classList.add('pressing')}} ,true);['pointerup','pointercancel'].forEach(k=>document.addEventListener(k,()=>{pressed?.classList.remove('pressing');pressed=null},true));['gesturestart','gesturechange','gestureend'].forEach(k=>document.addEventListener(k,e=>{if(e.target.closest?.('.game'))e.preventDefault()},{passive:false}));document.addEventListener('contextmenu',e=>{if(e.target.closest?.('.game'))e.preventDefault()});
let selected=null,active='neutral';const layers=[...document.querySelectorAll('.world')];function setWorld(next){if(next===active)return;const n=layers.find(x=>x.dataset.world===next),c=layers.find(x=>x.dataset.world===active);n?.classList.add('active');requestAnimationFrame(()=>c?.classList.remove('active'));active=next}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{tone(250,.08,.018);haptic(7);fx(b);setWorld(b.dataset.world);document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b;modeTitle.textContent=b.dataset.title;modeSub.textContent=b.dataset.sub;game.classList.add('has')});const desc={'関東合戦':'現代の首都圏に広がる異変を追う合戦モードです。','東西合戦':'列島を二分する妖怪勢力の大規模な衝突を扱います。','西洋妖怪決戦':'境界の外から来る異質な妖怪勢力との決戦です。'};function show(html){panelBody.innerHTML=html;game.classList.add('overlay-open');overlay.classList.add('open')}function close(){overlay.classList.remove('open');setTimeout(()=>game.classList.remove('overlay-open'),120)}document.getElementById('open').onclick=()=>{if(!selected)return;tone(190,.1,.02);fx(document.getElementById('open'));show(`<div class="panel-title">${selected.dataset.title}</div><div class="line"></div><p class="sub">${selected.dataset.sub}</p><p class="panel-copy">${desc[selected.dataset.title]}</p><button class="start" id="startBattle">この合戦を始める ›</button>`);document.getElementById('startBattle').onclick=()=>{tone(145,.15,.03);fx(document.getElementById('startBattle'));toast.textContent='次工程：合戦本編へ接続';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1000)}};document.getElementById('back').onclick=close;function settings(){const on=k=>prefs[k]?' on':'';return `<div class="panel-title">設定</div><div class="line"></div><p class="panel-copy">HOMEからいつでも環境を整えられます。</p><div class="settings"><div class="setting"><span>UI効果音</span><button class="switch${on('sound')}" data-setting="sound"><i></i></button></div><div class="setting"><span>画面演出</span><button class="switch${on('motion')}" data-setting="motion"><i></i></button></div><div class="setting"><span>振動（対応端末）</span><button class="switch${on('haptic')}" data-setting="haptic"><i></i></button></div></div>`}document.querySelectorAll('.util').forEach(b=>b.onclick=()=>{tone();fx(b);document.querySelectorAll('.util').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.panel==='encyclopedia')show(`<div class="panel-title">妖怪図鑑</div><div class="line"></div><p class="panel-copy">妖怪を調べるためのHOME機能です。</p><div class="grid"><button class="tile"><strong>河童</strong><small>水辺に関わる妖怪。</small></button><button class="tile"><strong>天狗</strong><small>山地に関わる妖怪。</small></button><button class="tile"><strong>鬼</strong><small>複数の伝承を持つ妖怪。</small></button><button class="tile"><strong>妖狐</strong><small>地域・伝承情報を確認する候補。</small></button></div>`);if(b.dataset.panel==='records')show(`<div class="panel-title">戦績</div><div class="line"></div><p class="panel-copy">指揮者としての合戦記録を確認します。</p><div class="stats"><div class="stat"><b>0</b><span>完了した合戦</span></div><div class="stat"><b>0</b><span>勝利</span></div><div class="stat"><b>—</b><span>最終出陣</span></div></div>`);if(b.dataset.panel==='settings')show(settings())});panelBody.addEventListener('click',e=>{const s=e.target.closest('.switch[data-setting]');if(!s)return;const k=s.dataset.setting;prefs[k]=!prefs[k];savePrefs();s.classList.toggle('on',prefs[k]);tone()});
let ready=false;function titleReady(){if(ready||innerWidth<=innerHeight)return;ready=true;requestAnimationFrame(()=>requestAnimationFrame(()=>game.classList.add('title-ready')))}titleReady();addEventListener('resize',titleReady,{passive:true});const titleScreen=document.getElementById('titleScreen'),titleStart=document.getElementById('titleStart');titleStart.addEventListener('pointerdown',e=>{const r=titleScreen.getBoundingClientRect();titleScreen.style.setProperty('--tap-x',((e.clientX-r.left)/r.width*100)+'%');titleScreen.style.setProperty('--tap-y',((e.clientY-r.top)/r.height*100)+'%');titleScreen.classList.remove('tap');requestAnimationFrame(()=>titleScreen.classList.add('tap'))});titleStart.onclick=()=>{tone(190,.1,.02);titleScreen.classList.add('leaving');game.classList.remove('title-active');setTimeout(()=>titleScreen.hidden=true,330)};
</script></body></html>

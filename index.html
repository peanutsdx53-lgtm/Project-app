<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YokaiBattlefield">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>YokaiBattlefield GitHub Safari Test D5</title>
<style>
:root{--gold:#d6b778;--gold2:#f0dca9;--paper:#efe5d0;--muted:#aa9e88;--ink:#05070b;--line:rgba(214,183,120,.28)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}
.game{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));overflow:hidden;background:radial-gradient(circle at 65% 35%,rgba(85,98,125,.32),transparent 30%),linear-gradient(160deg,#111927 0%,#07101c 45%,#020407 100%);border:1px solid rgba(214,183,120,.20);isolation:isolate}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.58),transparent 38%),linear-gradient(0deg,rgba(0,0,0,.72),transparent 40%);z-index:1}
.scene{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 58%,rgba(255,210,120,.15),transparent 4%),radial-gradient(ellipse at 72% 46%,rgba(135,170,210,.12),transparent 12%),repeating-linear-gradient(90deg,transparent 0 5.5%,rgba(255,255,255,.025) 5.55% 5.7%,transparent 5.75% 7%);opacity:.8;z-index:0}
.home-ui{position:absolute;inset:0;z-index:3;transition:opacity .22s ease,transform .3s ease}
.game.overlay-open .home-ui{opacity:0;pointer-events:none;transform:scale(1.01)}
.copy{position:absolute;left:6.5%;top:13%;width:34%;opacity:0;transform:translateY(6px);transition:.3s ease}.game.has .copy{opacity:1;transform:none}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(28px,4.2vw,64px);letter-spacing:.09em;margin:0 0 12px;white-space:nowrap}.sub{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(12px,1.5vw,22px);letter-spacing:.12em;color:#d8c9ad;margin:0 0 14px}.line{width:90%;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:8px 0 12px}.open{border:0;background:transparent;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.2vw,18px);letter-spacing:.12em;padding:9px 30px 9px 0;cursor:pointer}.open.pressing{background:linear-gradient(90deg,#efdcae,transparent);color:#18120a}
.rail{position:absolute;left:24.2%;bottom:6%;width:45.2%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mode{height:clamp(58px,8vw,112px);min-width:0;border:1px solid rgba(214,183,120,.34);background:linear-gradient(180deg,rgba(30,40,55,.62),rgba(4,6,10,.9));color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.18vw,18px);letter-spacing:.055em;white-space:nowrap;cursor:pointer;transition:.12s ease}.mode.pressing{transform:scale(.985);background:#dfc284;color:#171109}.mode.sel{border-color:#efd89f;box-shadow:0 0 14px rgba(214,183,120,.18)}
.utils{position:absolute;right:3.3%;bottom:5.8%;width:21.5%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.util{height:clamp(56px,7vw,100px);min-width:0;border:0;border-left:1px solid rgba(214,183,120,.25);background:rgba(3,5,9,.36);color:var(--paper);white-space:nowrap;font-size:clamp(9px,.75vw,12px);cursor:pointer;padding:0 2px}.util.pressing,.util.active{background:rgba(214,183,120,.15);color:var(--gold2)}
.build{position:absolute;left:1.7%;bottom:2.2%;font:clamp(8px,.72vw,11px) system-ui;color:rgba(255,255,255,.44);letter-spacing:.08em}
.overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(90deg,rgba(2,4,8,.98),rgba(2,4,8,.78) 52%,rgba(2,4,8,.40));opacity:0;pointer-events:none;transition:opacity .26s ease}.overlay.open{opacity:1;pointer-events:auto}.panel{position:absolute;left:6%;top:10%;width:55%;height:78%;overflow:hidden}
.back{border:1px solid rgba(214,183,120,.35);background:rgba(4,6,10,.72);color:var(--paper);padding:8px 14px;cursor:pointer}.panel-title{margin-top:18px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(26px,3.4vw,52px);font-weight:500;letter-spacing:.09em}.panel-copy{max-width:620px;font-size:clamp(10px,.95vw,14px);line-height:1.8;color:#d1c4ac}.start{margin-top:20px;border:1px solid #e5c98e;background:linear-gradient(135deg,#f0dfb7,#b18847);color:#18120a;padding:12px 28px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(14px,1.5vw,22px);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;max-width:650px}.tile{border:1px solid var(--line);background:rgba(10,15,24,.62);padding:12px;text-align:left}.tile strong{display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(13px,1.15vw,17px);margin-bottom:5px}.tile small{color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;max-width:650px}.stat{border:1px solid var(--line);padding:14px;background:rgba(10,15,24,.62)}.stat b{display:block;font:500 clamp(22px,2.4vw,38px) "Hiragino Mincho ProN","Yu Mincho",serif;color:var(--gold2)}.stat span{font-size:11px;color:var(--muted)}
.settings{margin-top:18px;max-width:650px}.setting{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 2px}.switch{width:52px;height:28px;border:1px solid rgba(214,183,120,.42);border-radius:20px;background:#111925;padding:3px;cursor:pointer}.switch i{display:block;width:20px;height:20px;border-radius:50%;background:#786b55;transition:.18s}.switch.on{background:#6e5630}.switch.on i{transform:translateX(24px);background:#f0dca9}
.toast{position:absolute;z-index:20;left:50%;bottom:3%;transform:translateX(-50%) translateY(6px);opacity:0;background:rgba(4,6,10,.92);border:1px solid var(--line);padding:7px 12px;font-size:11px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media (orientation:portrait) and (max-width:900px){.viewport{display:none}body:after{content:"横向きで指揮してください";position:fixed;inset:0;display:grid;place-items:center;background:#05070b;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.12em}}
/* D5 — mobile game interaction layer: targeted controls only */
html,body,.viewport{
  overscroll-behavior:none;
  -webkit-overflow-scrolling:auto;
}
*{
  -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.game{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;
}
.game button,.game [role="button"]{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-appearance:none;
  appearance:none;
}
.overlay,.panel,#panelBody,.scene,.home-ui{
  -webkit-tap-highlight-color:rgba(0,0,0,0);
}
.game input,.game textarea,.game select{
  touch-action:manipulation;
  -webkit-user-select:text;
  user-select:text;
  font-size:max(16px,1em);
}
.back.pressing,.tile.pressing{filter:brightness(1.12)}
.start.pressing{filter:brightness(1.08);transform:translateY(1px) scale(.992)}
.switch.pressing{filter:brightness(1.15)}
</style>
</head>
<body>
<div class="viewport"><main class="game" id="game"><div class="scene"></div>
  <section class="home-ui">
    <section class="copy" id="copy"><h1 id="title">関東合戦</h1><div class="line"></div><p class="sub" id="sub">首都圏に広がる異変</p><button class="open" id="open">この合戦を見る →</button></section>
    <nav class="rail" aria-label="合戦モード">
      <button class="mode" data-title="関東合戦" data-sub="首都圏に広がる異変">関東合戦</button>
      <button class="mode" data-title="東西合戦" data-sub="列島を分ける二つの妖勢">東西合戦</button>
      <button class="mode" data-title="西洋妖怪決戦" data-sub="境界の外から来る妖異">西洋妖怪決戦</button>
    </nav>
    <nav class="utils" aria-label="ホーム機能">
      <button class="util" data-panel="encyclopedia">妖怪図鑑</button>
      <button class="util" data-panel="records">戦績</button>
      <button class="util" data-panel="settings">設定</button>
    </nav>
    <div class="build" id="buildLabel">GH TEST D5</div>
  </section>
  <section class="overlay" id="overlay" aria-hidden="true"><div class="panel"><button class="back" id="back">‹ ホームへ戻る</button><div id="panelBody"></div></div></section>
  <div class="toast" id="toast"></div>
</main></div>
<script>
const APP_VERSION='D5';let updateCheckBusy=false;async function checkForAppUpdate(reason='startup'){if(updateCheckBusy)return;updateCheckBusy=true;try{const u=new URL('version.json',location.href);u.searchParams.set('_',Date.now().toString());const res=await fetch(u.toString(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!res.ok)return;const remote=await res.json();if(!remote?.version||remote.version===APP_VERSION)return;const current=new URL(location.href);current.searchParams.set('v',remote.version);current.searchParams.set('_u',Date.now().toString());try{if(typeof showToast==='function')showToast('最新版を反映します')}catch(e){}setTimeout(()=>location.replace(current.toString()),220)}catch(e){}finally{updateCheckBusy=false}}
window.addEventListener('pageshow',()=>setTimeout(()=>checkForAppUpdate('pageshow'),250));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(()=>checkForAppUpdate('resume'),180)});window.addEventListener('focus',()=>setTimeout(()=>checkForAppUpdate('focus'),220));setInterval(()=>{if(document.visibilityState==='visible')checkForAppUpdate('interval')},60000);
function insideGame(target){
  return !!(target && target.closest && target.closest('.game'));
}

/* iOS pinch prevention only. Ordinary tap end is never cancelled. */
['gesturestart','gesturechange','gestureend'].forEach(type=>{
  document.addEventListener(type,e=>{
    if(insideGame(e.target)) e.preventDefault();
  },{passive:false});
});

/* Long-press browser UI remains disabled in the game. */
document.addEventListener('contextmenu',e=>{
  if(insideGame(e.target)) e.preventDefault();
});
document.addEventListener('selectstart',e=>{
  if(insideGame(e.target) && !e.target.closest('input,textarea,select')) e.preventDefault();
});

/* Press visuals are attached only to a real control.
   Tapping blank panel/background can never create a visual pressed state. */
let pressedControl=null;
document.addEventListener('pointerdown',e=>{
  const control=e.target.closest?.('button,[role="button"]');
  if(!control || !control.closest('.game')) return;
  pressedControl=control;
  control.classList.add('pressing');
},{capture:true});
function clearPressed(){
  if(pressedControl){
    pressedControl.classList.remove('pressing');
    pressedControl=null;
  }
}
document.addEventListener('pointerup',clearPressed,{capture:true});
document.addEventListener('pointercancel',clearPressed,{capture:true});
window.addEventListener('blur',clearPressed);

const game=document.getElementById('game'),copy=document.getElementById('copy'),title=document.getElementById('title'),sub=document.getElementById('sub'),overlay=document.getElementById('overlay'),panelBody=document.getElementById('panelBody'),toast=document.getElementById('toast');let selected=null;const modeDescriptions={'関東合戦':'現代の首都圏に広がる異変を追う合戦モードです。','東西合戦':'列島を二分する妖怪勢力の大規模な衝突を扱います。','西洋妖怪決戦':'境界の外から来る異質な妖怪勢力との決戦です。'};function showOverlay(html){panelBody.innerHTML=html;game.classList.add('overlay-open');overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}function closeOverlay(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');setTimeout(()=>game.classList.remove('overlay-open'),140)}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1200)}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b;title.textContent=b.dataset.title;sub.textContent=b.dataset.sub;game.classList.add('has')});document.getElementById('open').onclick=()=>{if(!selected)return;showOverlay(`<div class="panel-title">${selected.dataset.title}</div><div class="line"></div><p class="sub">${selected.dataset.sub}</p><p class="panel-copy">${modeDescriptions[selected.dataset.title]}</p><button class="start" id="startBattle">この合戦を始める ›</button>`);setTimeout(()=>{const s=document.getElementById('startBattle');if(s)s.onclick=()=>showToast('次工程：合戦本編へ接続')},0)};document.getElementById('back').onclick=closeOverlay;document.querySelectorAll('.util').forEach(b=>b.onclick=()=>{document.querySelectorAll('.util').forEach(x=>x.classList.toggle('active',x===b));const p=b.dataset.panel;if(p==='encyclopedia')showOverlay(`<div class="panel-title">妖怪図鑑</div><div class="line"></div><p class="panel-copy">妖怪を調べるためのHOME機能です。</p><div class="grid"><button class="tile"><strong>河童</strong><small>水辺に関わる妖怪。</small></button><button class="tile"><strong>天狗</strong><small>山地に関わる妖怪。</small></button><button class="tile"><strong>鬼</strong><small>複数の伝承を持つ妖怪。</small></button><button class="tile"><strong>妖狐</strong><small>伝承・能力・地域情報を確認する候補。</small></button></div>`);if(p==='records')showOverlay(`<div class="panel-title">戦績</div><div class="line"></div><p class="panel-copy">指揮者としての合戦記録を確認します。</p><div class="stats"><div class="stat"><b>0</b><span>完了した合戦</span></div><div class="stat"><b>0</b><span>勝利</span></div><div class="stat"><b>—</b><span>最終出陣</span></div></div>`);if(p==='settings')showOverlay(`<div class="panel-title">設定</div><div class="line"></div><p class="panel-copy">HOMEからいつでも環境を整えられます。</p><div class="settings"><div class="setting"><span>UI効果音</span><button class="switch on"><i></i></button></div><div class="setting"><span>画面演出</span><button class="switch on"><i></i></button></div><div class="setting"><span>振動（対応端末）</span><button class="switch"><i></i></button></div></div>`);setTimeout(()=>document.querySelectorAll('.switch').forEach(s=>s.onclick=()=>s.classList.toggle('on')),0)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeOverlay()});
</script></body></html>

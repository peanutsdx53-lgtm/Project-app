ip{position:absolute;left:var(--x,50%);top:var(--y,72%);width:24px;height:24px;border:1px solid #f4dba7b3;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.35)}.title.tap .rip{animation:rip .36s}.title.out{opacity:0;transform:scale(1.014);pointer-events:none}.title[hidden]{display:none!important}.game.start .home{opacity:0;visibility:hidden;pointer-events:none}.game.start .world.on,.game.start .mist,.game.start .glow{animation-play-state:paused}.rm *,.rm *:before,.rm *:after{animation-duration:.001ms!important;transition-duration:.001ms!important}@keyframes drift{to{transform:scale(1.037) translate(.3%,-.18%)}}@keyframes mist{to{transform:translate(1.45%,-.24%);opacity:.18}}@keyframes glow{50%{opacity:.38}}@keyframes sigil{50%{box-shadow:0 0 12px #e9cc9061;opacity:1}}@keyframes sheen{20%{opacity:.72}to{left:122%;opacity:0}}@keyframes rip{to{opacity:0;transform:translate(-50%,-50%) scale(3)}}@media(orientation:portrait) and (max-width:900px){.v{display:none}body:after{content:"横向きで指揮してください";position:fixed;inset:0;display:grid;place-items:center;background:#05070b;font-family:"Yu Mincho",serif}}
</style></head><body><div class="v"><main class="game start" id="game"><div class="scene"><div class="world neutral on" data-w="neutral"></div><div class="world kanto" data-w="kanto"></div><div class="world eastwest" data-w="eastwest"></div><div class="world western" data-w="western"></div><div class="mist"></div><div class="glow"></div></div><section class="title" id="title"><div class="tc"><h1 class="logo">Yokai Battlefield</h1><div class="tr"></div><div class="tag">あやかしの戦場は、まだ終わっていない</div></div><div class="tp">画面をタップして始める</div><div class="rip"></div><button class="ts" id="ts"></button></section><section class="home"><section class="copy"><h1 id="mt">関東合戦</h1><div class="line"></div><p class="sub" id="ms">首都圏に広がる異変</p><button class="open" id="open">この合戦を見る →</button></section><nav class="rail"><button class="mode" data-t="関東合戦" data-s="首都圏に広がる異変" data-w="kanto">関東合戦</button><button class="mode" data-t="東西合戦" data-s="列島を分ける二つの妖勢" data-w="eastwest">東西合戦</button><button class="mode" data-t="西洋妖怪決戦" data-s="境界の外から来る妖異" data-w="western">西洋妖怪決戦</button></nav><nav class="utils"><button class="util" data-p="encyclopedia">妖怪図鑑</button><button class="util" data-p="records">戦績</button><button class="util" data-p="settings">設定</button></nav><div class="build">GH TEST D14</div></section><section class="overlay" id="ov"><div class="panel"><button class="back" id="back">‹ ホームへ戻る</button><div id="body"></div></div></section><div class="toast" id="toast"></div></main></div><script>
const V='D14',g=document.getElementById('game'),ov=document.getElementById('ov'),body=document.getElementById('body'),mt=document.getElementById('mt'),ms=document.getElementById('ms'),toast=document.getElementById('toast'),openBtn=document.getElementById('open'),backBtn=document.getElementById('back');let pref={sound:true,motion:true,haptic:false};try{pref={...pref,...JSON.parse(localStorage.getItem('yb')||'{}')}}catch(e){}const save=()=>{try{localStorage.setItem('yb',JSON.stringify(pref))}catch(e){}g.classList.toggle('rm',!pref.motion)};save();let ac;try{ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'})}catch(e){}function tone(f=320){if(!pref.sound||!ac)return;ac.resume?.();let o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime;o.frequency.value=f;a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(.012,t+.005);a.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(a).connect(ac.destination);o.start(t);o.stop(t+.08)}function fx(e){if(!pref.motion)return;e.classList.remove('fx');requestAnimationFrame(()=>{e.classList.add('fx');setTimeout(()=>e.classList.remove('fx'),340)})}let p;document.addEventListener('pointerdown',e=>{let b=e.target.closest?.('button');if(b&&b.closest('.game')){p=b;b.classList.add('press')}},true);['pointerup','pointercancel'].forEach(x=>document.addEventListener(x,()=>{p?.classList.remove('press');p=null},true));['gesturestart','gesturechange','gestureend'].forEach(x=>document.addEventListener(x,e=>{if(e.target.closest?.('.game'))e.preventDefault()},{passive:false}));let sel,aw='neutral',ws=[...document.querySelectorAll('.world')];function world(n){if(n===aw)return;ws.find(x=>x.dataset.w===n)?.classList.add('on');requestAnimationFrame(()=>ws.find(x=>x.dataset.w===aw)?.classList.remove('on'));aw=n}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{tone(250);fx(b);world(b.dataset.w);document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;mt.textContent=b.dataset.t;ms.textContent=b.dataset.s;g.classList.add('has')});let desc={'関東合戦':'現代の首都圏に広がる異変を追う合戦モードです。','東西合戦':'列島を二分する妖怪勢力の大規模な衝突を扱います。','西洋妖怪決戦':'境界の外から来る異質な妖怪勢力との決戦です。'};function show(k,h){ov.dataset.kind=k;body.innerHTML=h;ov.classList.remove('on');g.classList.add('overlay');requestAnimationFrame(()=>ov.classList.add('on'))}function close(){ov.classList.remove('on');setTimeout(()=>g.classList.remove('overlay'),120)}openBtn.onclick=()=>{if(!sel)return;tone(190);fx(openBtn);show('mode',`<div class="pt">${sel.dataset.t}</div><div class="line"></div><p class="sub">${sel.dataset.s}</p><p class="pc">${desc[sel.dataset.t]}</p><button class="start" id="startBattle">この合戦を始める ›</button>`);const sb=document.getElementById('startBattle');sb.onclick=()=>{tone(145);fx(sb);toast.textContent='次工程：合戦本編へ接続';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),900)}};backBtn.onclick=()=>{tone(380);fx(backBtn);close()};function settings(){let on=k=>pref[k]?' on':'';return `<div class="pt">設定</div><div class="line"></div><p class="pc">HOMEからいつでも環境を整えられます。</p><div class="settings"><div class="setting">UI効果音<button class="sw${on('sound')}" data-k="sound"><i></i></button></div><div class="setting">画面演出<button class="sw${on('motion')}" data-k="motion"><i></i></button></div><div class="setting">振動<button class="sw${on('haptic')}" data-k="haptic"><i></i></button></div></div>`}document.querySelectorAll('.util').forEach(b=>b.onclick=()=>{tone();fx(b);document.querySelectorAll('.util').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.p==='encyclopedia')show('encyclopedia','<div class="pt">妖怪図鑑</div><div class="line"></div><p class="pc">妖怪を調べるためのHOME機能です。</p><div class="grid"><button class="tile"><strong>河童</strong><small>水辺に関わる妖怪。</small></button><button class="tile"><strong>天狗</strong><small>山地に関わる妖怪。</small></button><button class="tile"><strong>鬼</strong><small>複数の伝承を持つ妖怪。</small></button><button class="tile"><strong>妖狐</strong><small>地域・伝承情報を確認。</small></button></div>');if(b.dataset.p==='records')show('records','<div class="pt">戦績</div><div class="line"></div><p class="pc">指揮者としての合戦記録を確認します。</p><div class="stats"><div class="stat"><b>0</b>完了した合戦</div><div class="stat"><b>0</b>勝利</div><div class="stat"><b>—</b>最終出陣</div></div>');if(b.dataset.p==='settings')show('settings',settings())});body.onclick=e=>{let s=e.target.closest('.sw');if(s){pref[s.dataset.k]=!pref[s.dataset.k];save();s.classList.toggle('on',pref[s.dataset.k]);tone()}};let ready=false;function rd(){if(ready||innerWidth<=innerHeight)return;ready=true;requestAnimationFrame(()=>requestAnimationFrame(()=>g.classList.add('ready')))}rd();addEventListener('resize',rd,{passive:true});let title=document.getElementById('title'),ts=document.getElementById('ts');ts.onpointerdown=e=>{let r=title.getBoundingClientRect();title.style.setProperty('--x',(e.clientX-r.left)/r.width*100+'%');title.style.setProperty('--y',(e.clientY-r.top)/r.height*100+'%');title.classList.remove('tap');requestAnimationFrame(()=>title.classList.add('tap'))};ts.onclick=()=>{tone(190);title.classList.add('out');g.classList.remove('start');setTimeout(()=>title.hidden=true,330)};async function upd(){try{let u=new URL('version.json',location.href);u.searchParams.set('_',Date.now());let r=await fetch(u,{cache:'no-store'}),j=await r.json();if(j.version&&j.version!==V){let x=new URL(location.href);x.searchParams.set('v',j.version);location.replace(x)}}catch(e){}}addEventListener('pageshow',()=>setTimeout(upd,250));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(upd,180)});

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YokaiBattlefield">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>YokaiBattlefield GitHub Safari Test D8</title>
<style>
:root{--gold:#d6b778;--gold2:#f0dca9;--paper:#efe5d0;--muted:#aa9e88;--ink:#05070b;--line:rgba(214,183,120,.28)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}
.game{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));overflow:hidden;background:radial-gradient(circle at 65% 35%,rgba(85,98,125,.32),transparent 30%),linear-gradient(160deg,#111927 0%,#07101c 45%,#020407 100%);border:1px solid rgba(214,183,120,.20);isolation:isolate}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.58),transparent 38%),linear-gradient(0deg,rgba(0,0,0,.72),transparent 40%);z-index:1}
.scene{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 58%,rgba(255,210,120,.15),transparent 4%),radial-gradient(ellipse at 72% 46%,rgba(135,170,210,.12),transparent 12%),repeating-linear-gradient(90deg,transparent 0 5.5%,rgba(255,255,255,.025) 5.55% 5.7%,transparent 5.75% 7%);opacity:.8;z-index:0}
.home-ui{position:absolute;inset:0;z-index:3;transition:opacity .22s ease,transform .3s ease}
.game.overlay-open .home-ui{opacity:0;pointer-events:none;transform:scale(1.01)}
.copy{position:absolute;left:6.5%;top:13%;width:34%;opacity:0;transform:translateY(6px);transition:.3s ease}.game.has .copy{opacity:1;transform:none}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(28px,4.2vw,64px);letter-spacing:.09em;margin:0 0 12px;white-space:nowrap}.sub{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(12px,1.5vw,22px);letter-spacing:.12em;color:#d8c9ad;margin:0 0 14px}.line{width:90%;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:8px 0 12px}.mode-open{border:0;background:transparent;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.2vw,18px);letter-spacing:.12em;padding:9px 30px 9px 0;cursor:pointer}.mode-open.pressing{background:linear-gradient(90deg,#efdcae,transparent);color:#18120a}
.rail{position:absolute;left:24.2%;bottom:6%;width:45.2%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mode{height:clamp(58px,8vw,112px);min-width:0;border:1px solid rgba(214,183,120,.34);background:linear-gradient(180deg,rgba(30,40,55,.62),rgba(4,6,10,.9));color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.18vw,18px);letter-spacing:.055em;white-space:nowrap;cursor:pointer;transition:.12s ease}.mode.pressing{transform:scale(.985);background:#dfc284;color:#171109}.mode.sel{border-color:#efd89f;box-shadow:0 0 14px rgba(214,183,120,.18)}
.utils{position:absolute;right:3.3%;bottom:5.8%;width:21.5%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.util{height:clamp(56px,7vw,100px);min-width:0;border:0;border-left:1px solid rgba(214,183,120,.25);background:rgba(3,5,9,.36);color:var(--paper);white-space:nowrap;font-size:clamp(9px,.75vw,12px);cursor:pointer;padding:0 2px}.util.pressing,.util.active{background:rgba(214,183,120,.15);color:var(--gold2)}
.build{position:absolute;left:1.7%;bottom:2.2%;font:clamp(8px,.72vw,11px) system-ui;color:rgba(255,255,255,.44);letter-spacing:.08em}
.overlay{position:absolute;inset:0;z-index:10;background:linear-gradient(90deg,rgba(2,4,8,.98),rgba(2,4,8,.78) 52%,rgba(2,4,8,.40));opacity:0;pointer-events:none;transition:opacity .26s ease}.overlay.is-open{opacity:1;pointer-events:auto}.panel{position:absolute;left:6%;top:10%;width:55%;height:78%;overflow:hidden}
.back{border:1px solid rgba(214,183,120,.35);background:rgba(4,6,10,.72);color:var(--paper);padding:8px 14px;cursor:pointer}.panel-title{margin-top:18px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(26px,3.4vw,52px);font-weight:500;letter-spacing:.09em}.panel-copy{max-width:620px;font-size:clamp(10px,.95vw,14px);line-height:1.8;color:#d1c4ac}.start{margin-top:20px;border:1px solid #e5c98e;background:linear-gradient(135deg,#f0dfb7,#b18847);color:#18120a;padding:12px 28px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(14px,1.5vw,22px);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;max-width:650px}.tile{border:1px solid var(--line);background:rgba(10,15,24,.62);padding:12px;text-align:left}.tile strong{display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(13px,1.15vw,17px);margin-bottom:5px}.tile small{color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;max-width:650px}.stat{border:1px solid var(--line);padding:14px;background:rgba(10,15,24,.62)}.stat b{display:block;font:500 clamp(22px,2.4vw,38px) "Hiragino Mincho ProN","Yu Mincho",serif;color:var(--gold2)}.stat span{font-size:11px;color:var(--muted)}
.settings{margin-top:18px;max-width:650px}.setting{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 2px}.switch{width:52px;height:28px;border:1px solid rgba(214,183,120,.42);border-radius:20px;background:#111925;padding:3px;cursor:pointer}.switch i{display:block;width:20px;height:20px;border-radius:50%;background:#786b55;transition:.18s}.switch.on{background:#6e5630}.switch.on i{transform:translateX(24px);background:#f0dca9}
.toast{position:absolute;z-index:20;left:50%;bottom:3%;transform:translateX(-50%) translateY(6px);opacity:0;background:rgba(4,6,10,.92);border:1px solid var(--line);padding:7px 12px;font-size:11px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media (orientation:portrait) and (max-width:900px){.viewport{display:none}body:after{content:"横向きで指揮してください";position:fixed;inset:0;display:grid;place-items:center;background:#05070b;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.12em}}
/* D5 — mobile game interaction layer: targeted controls only */
html,body,.viewport{overscroll-behavior:none;-webkit-overflow-scrolling:auto}
*{-webkit-tap-highlight-color:rgba(0,0,0,0)}
.game{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.game button,.game [role="button"]{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-appearance:none;appearance:none}
.overlay,.panel,#panelBody,.scene,.home-ui{-webkit-tap-highlight-color:rgba(0,0,0,0)}
.game input,.game textarea,.game select{touch-action:manipulation;-webkit-user-select:text;user-select:text;font-size:max(16px,1em)}
.back.pressing,.tile.pressing{filter:brightness(1.12)}.start.pressing{filter:brightness(1.08);transform:translateY(1px) scale(.992)}.switch.pressing{filter:brightness(1.15)}
/* D6 — Yokai interaction polish: lightweight GPU-friendly effects */
.mode,.util,.mode-open,.back,.tile,.start{position:relative;overflow:hidden;isolation:isolate;transform:translateZ(0);will-change:transform,opacity}
.mode::before,.util::before,.mode-open::before,.back::before,.tile::before,.start::before{content:"";position:absolute;top:-25%;bottom:-25%;left:-42%;width:24%;pointer-events:none;opacity:0;transform:translate3d(0,0,0) rotate(12deg);background:linear-gradient(90deg,transparent,rgba(255,241,204,.72),rgba(214,183,120,.30),transparent)}
.mode.fx::before,.mode-open.fx::before,.start.fx::before{animation:ybSheen .34s cubic-bezier(.2,.78,.2,1)}.util.fx::before,.back.fx::before,.tile.fx::before{animation:ybSheenSoft .26s cubic-bezier(.2,.78,.2,1)}
@keyframes ybSheen{0%{left:-42%;opacity:0}18%{opacity:.82}100%{left:122%;opacity:0}}@keyframes ybSheenSoft{0%{left:-42%;opacity:0}22%{opacity:.48}100%{left:122%;opacity:0}}
.mode.pressing{transform:translate3d(0,1px,0) scale(.982)}.mode.fx{animation:ybModeSet .32s cubic-bezier(.2,.82,.2,1)}@keyframes ybModeSet{0%{transform:scale(.982)}48%{transform:scale(1.012)}100%{transform:scale(1)}}
.mode.sel{border-color:#f0d89c;box-shadow:inset 0 0 0 1px rgba(240,216,156,.14),0 0 12px rgba(214,183,120,.14)}.mode.sel::after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;border:1px solid rgba(240,220,175,.84);background:#0a0d13;transform:translateX(-50%) rotate(45deg);box-shadow:0 0 9px rgba(233,204,144,.28)}
.mode-open .arrow,.start .arrow{display:inline-block;transition:transform .16s cubic-bezier(.2,.8,.2,1)}.mode-open.fx .arrow,.start.fx .arrow{transform:translateX(6px)}.mode-open.fx{color:var(--gold2);text-shadow:0 0 12px rgba(225,196,133,.16)}
.util.fx,.back.fx,.tile.fx{border-color:rgba(231,204,149,.48)}.start{transition:transform .10s ease,box-shadow .18s ease,filter .12s ease}.start.fx{box-shadow:0 0 0 1px rgba(239,216,166,.18),0 0 20px rgba(218,177,93,.18)}
.scene{transform:scale(1);transform-origin:60% 52%;will-change:transform,opacity}.game.world-fx .scene{animation:ybWorldRespond .34s cubic-bezier(.2,.8,.2,1)}@keyframes ybWorldRespond{0%{transform:scale(1);opacity:.80}42%{transform:scale(1.007);opacity:.94}100%{transform:scale(1);opacity:.80}}
.game::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle at 55% 57%,rgba(231,196,125,.18),rgba(231,196,125,.035) 20%,transparent 46%)}.game.world-fx::after{animation:ybWorldGlow .36s ease-out}.game.confirm-fx::after{background:radial-gradient(circle at 46% 64%,rgba(247,222,169,.38),rgba(204,153,64,.07) 27%,transparent 57%);animation:ybConfirmGlow .46s ease-out}@keyframes ybWorldGlow{0%{opacity:0}34%{opacity:.72}100%{opacity:0}}@keyframes ybConfirmGlow{0%{opacity:0}35%{opacity:.90}100%{opacity:0}}
.overlay.is-open .panel{animation:ybPanelIn .24s cubic-bezier(.2,.82,.2,1)}@keyframes ybPanelIn{from{opacity:0;transform:translate3d(8px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.game.reduce-motion *,.game.reduce-motion *::before,.game.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}@media (prefers-reduced-motion:reduce){.game *,.game *::before,.game *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
/* D7 — collision guard: overlay geometry is authoritative */
.overlay,
.overlay.is-open{
  position:absolute!important;
  inset:0!important;
  width:auto!important;
  height:auto!important;
}

.title-screen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    radial-gradient(circle at 50% 76%,rgba(244,220,166,.16),transparent 12%),
    linear-gradient(180deg,transparent 55%,rgba(0,0,0,.18));
}
.title-start{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  color:transparent;
  cursor:pointer;
  touch-action:manipulation;
}
.title-start::before{
  content:"";
  position:absolute;
  left:50%;
  top:76.6%;
  width:14px;
  height:14px;
  border:1px solid rgba(245,222,173,.82);
  transform:translate(-50%,-50%) rotate(45deg) scale(.70);
  opacity:.36;
  box-shadow:0 0 11px rgba(235,200,132,.18);
  animation:titleBreath 2.6s ease-in-out infinite;
}
.title-start::after{
  content:"";
  position:absolute;
  left:50%;
  top:76.6%;
  width:44px;
  height:44px;
  border:1px solid rgba(241,215,160,.0);
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.45);
  opacity:0;
}
.title-start.pressing::after{
  animation:titleTapRing .34s cubic-bezier(.18,.72,.2,1);
}
.title-start.pressing::before{
  opacity:.9;
  transform:translate(-50%,-50%) rotate(45deg) scale(.92);
}
@keyframes titleBreath{
  0%,100%{opacity:.28;box-shadow:0 0 8px rgba(235,200,132,.12)}
  50%{opacity:.72;box-shadow:0 0 15px rgba(235,200,132,.30)}
}
@keyframes titleTapRing{
  0%{opacity:.72;border-color:rgba(247,226,181,.72);transform:translate(-50%,-50%) scale(.40)}
  100%{opacity:0;border-color:rgba(247,226,181,0);transform:translate(-50%,-50%) scale(2.25)}
}
.title-screen.is-leaving{
  opacity:0;
  transform:scale(1.018);
  pointer-events:none;
}
.game.title-active .home-ui{
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
  transform:none!important;
}
.game.title-entering .home-ui{
  animation:homeReveal .34s .06s both cubic-bezier(.2,.8,.2,1);
}
@keyframes homeReveal{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:none}
}
.title-screen[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  .title-start::before{animation:none}
  .title-screen{transition-duration:.001ms}
}

<body>
<div class="viewport"><main class="game title-active" id="game"><div class="scene"></div>

  <section class="title-screen" id="titleScreen" aria-label="YokaiBattlefield タイトル画面">
    <button class="title-start" id="titleStart" type="button" aria-label="画面をタップして始める"></button>
  </section>

  <section class="home-ui">
    <section class="copy" id="copy"><h1 id="title">関東合戦</h1><div class="line"></div><p class="sub" id="sub">首都圏に広がる異変</p><button class="mode-open" id="open">この合戦を見る <span class="arrow">→</span></button></section>
    <nav class="rail" aria-label="合戦モード">
      <button class="mode" data-title="関東合戦" data-sub="首都圏に広がる異変">関東合戦</button>
      <button class="mode" data-title="東西合戦" data-sub="列島を分ける二つの妖勢">東西合戦</button>
      <button class="mode" data-title="西洋妖怪決戦" data-sub="境界の外から来る妖異">西洋妖怪決戦</button>
    </nav>
    <nav class="utils" aria-label="ホーム機能">
      <button class="util" data-panel="encyclopedia">妖怪図鑑</button>
      <button class="util" data-panel="records">戦績</button>
      <button class="util" data-panel="settings">設定</button>
    </nav>
    <div class="build" id="buildLabel">GH TEST D8</div>
  </section>
  <section class="overlay" id="overlay" aria-hidden="true"><div class="panel"><button class="back" id="back">‹ ホームへ戻る</button><div id="panelBody"></div></div></section>
  <div class="toast" id="toast"></div>
</main></div>
<script>
const APP_VERSION='D8';
let updateCheckBusy=false;

async function checkForAppUpdate(reason='startup'){
  if(updateCheckBusy)return;
  updateCheckBusy=true;
  try{
    const u=new URL('version.json',location.href);
    u.searchParams.set('_',Date.now().toString());
    const res=await fetch(u.toString(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache'}
    });
    if(!res.ok)return;
    const remote=await res.json();
    if(!remote?.version || remote.version===APP_VERSION)return;

    const current=new URL(location.href);
    current.searchParams.set('v',remote.version);
    current.searchParams.set('_u',Date.now().toString());

    try{
      if(typeof showToast==='function')showToast('最新版を反映します');
    }catch(e){}
    setTimeout(()=>location.replace(current.toString()),220);
  }catch(e){
    // Offline / transient Pages failure: continue using the current build.
  }finally{
    updateCheckBusy=false;
  }
}

window.addEventListener('pageshow',()=>setTimeout(()=>checkForAppUpdate('pageshow'),250));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')setTimeout(()=>checkForAppUpdate('resume'),180);
});
window.addEventListener('focus',()=>setTimeout(()=>checkForAppUpdate('focus'),220));
setInterval(()=>{ if(document.visibilityState==='visible')checkForAppUpdate('interval') },60000);


/* D4 — prevent accidental browser gestures inside the game surface.
   Buttons still receive ordinary single taps. */
function insideGame(target){
  return !!(target && target.closest && target.closest('.game'));
}

/* iOS pinch prevention only. Ordinary tap end is never cancelled. */
['gesturestart','gesturechange','gestureend'].forEach(type=>{
  document.addEventListener(type,e=>{
    if(insideGame(e.target)) e.preventDefault();
  },{passive:false});
});

/* Long-press browser UI remains disabled in the game. */
document.addEventListener('contextmenu',e=>{
  if(insideGame(e.target)) e.preventDefault();
});
document.addEventListener('selectstart',e=>{
  if(insideGame(e.target) && !e.target.closest('input,textarea,select')) e.preventDefault();
});

/* Press visuals are attached only to a real control.
   Tapping blank panel/background can never create a visual pressed state. */
let pressedControl=null;
document.addEventListener('pointerdown',e=>{
  const control=e.target.closest?.('button,[role="button"]');
  if(!control || !control.closest('.game')) return;
  pressedControl=control;
  control.classList.add('pressing');
},{capture:true});
function clearPressed(){
  if(pressedControl){
    pressedControl.classList.remove('pressing');
    pressedControl=null;
  }
}
document.addEventListener('pointerup',clearPressed,{capture:true});
document.addEventListener('pointercancel',clearPressed,{capture:true});
window.addEventListener('blur',clearPressed);

const game=document.getElementById('game'),
      copy=document.getElementById('copy'),
      title=document.getElementById('title'),
      sub=document.getElementById('sub'),
      overlay=document.getElementById('overlay'),
      panelBody=document.getElementById('panelBody'),
      toast=document.getElementById('toast');

let selected=null;
const modeDescriptions={
  '関東合戦':'現代の首都圏に広がる異変を追う合戦モードです。',
  '東西合戦':'列島を二分する妖怪勢力の大規模な衝突を扱います。',
  '西洋妖怪決戦':'境界の外から来る異質な妖怪勢力との決戦です。'
};

/* Lightweight preference state for prototype SE / motion / haptics. */
const defaultPrefs={sound:true,motion:true,haptic:false};
let prefs={...defaultPrefs};
try{
  prefs={...defaultPrefs,...JSON.parse(localStorage.getItem('yb-ui-prefs')||'{}')};
}catch(e){}
function savePrefs(){
  try{localStorage.setItem('yb-ui-prefs',JSON.stringify(prefs))}catch(e){}
  game.classList.toggle('reduce-motion',!prefs.motion);
}
savePrefs();

/* Low-latency placeholder UI audio.
   These are interaction prototypes, not final produced SE assets. */
let audioCtx=null;
/* Prepare the audio engine before the first control tap.
   iOS may keep it suspended until a user gesture, but creation cost is not
   charged to the first HOME command. */
try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC) audioCtx=new AC({latencyHint:'interactive'});
}catch(e){}
function ensureAudio(){
  if(!prefs.sound)return null;
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC) audioCtx=new AC({latencyHint:'interactive'});
    }
    if(audioCtx?.state==='suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch(e){return null}
}
function tone(freq,dur,gain,type='sine',delay=0,ratio=1.1){
  const ctx=ensureAudio(); if(!ctx)return;
  const now=ctx.currentTime+delay;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,now);
  o.frequency.exponentialRampToValueAtTime(Math.max(45,freq*ratio),now+dur);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(gain,now+.006);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o.connect(g).connect(ctx.destination);o.start(now);o.stop(now+dur+.02);
}
let lastUiSoundAt=0;
function playUiSound(kind){
  if(!prefs.sound)return;
  const now=performance.now();
  if(kind!=='confirm' && now-lastUiSoundAt<38)return;
  lastUiSoundAt=now;
  if(kind==='soft'){tone(430,.045,.012,'sine',0,1.03);return}
  if(kind==='mode'){tone(250,.085,.024,'sine',0,1.20);tone(520,.065,.008,'triangle',.012,1.08);return}
  if(kind==='enter'){tone(190,.12,.030,'triangle',0,1.24);tone(380,.09,.009,'sine',.018,1.10);return}
  if(kind==='confirm'){tone(145,.17,.038,'triangle',0,1.32);tone(292,.13,.014,'sine',.024,1.16);tone(580,.08,.006,'sine',.045,.96)}
}
function haptic(kind){
  if(!prefs.haptic)return;
  try{navigator.vibrate?.(kind==='confirm'?[14,24,12]:kind==='mode'?8:5)}catch(e){}
}

/* Performance instrumentation: handler cost only, not a user-facing feature. */
window.__ybPerf={samples:[],maxHandlerMs:0,lastHandlerMs:0};
function perfWrap(fn){
  return function(...args){
    const t0=performance.now();
    const result=fn.apply(this,args);
    const ms=performance.now()-t0;
    window.__ybPerf.lastHandlerMs=ms;
    window.__ybPerf.maxHandlerMs=Math.max(window.__ybPerf.maxHandlerMs,ms);
    window.__ybPerf.samples.push(ms);
    if(window.__ybPerf.samples.length>120)window.__ybPerf.samples.shift();
    return result;
  }
}

function retrigger(el,cls,ms=380){
  if(!el || !prefs.motion)return;
  const rafKey='_ybRaf_'+cls, timerKey='_ybTimer_'+cls;
  el.classList.remove(cls);
  cancelAnimationFrame(el[rafKey]||0);
  clearTimeout(el[timerKey]);
  el[rafKey]=requestAnimationFrame(()=>{
    el.classList.add(cls);
    el[timerKey]=setTimeout(()=>el.classList.remove(cls),ms);
  });
}
function worldFx(strong=false){
  if(!prefs.motion)return;
  const cls=strong?'confirm-fx':'world-fx';
  const rafKey='_ybWorldRaf_'+cls, timerKey='_ybWorldTimer_'+cls;
  game.classList.remove(cls);
  cancelAnimationFrame(game[rafKey]||0);
  clearTimeout(game[timerKey]);
  game[rafKey]=requestAnimationFrame(()=>{
    game.classList.add(cls);
    game[timerKey]=setTimeout(()=>game.classList.remove(cls),strong?500:390);
  });
}
function controlFx(el,rank='soft'){
  retrigger(el,'fx',rank==='confirm'?500:360);
  playUiSound(rank);
  haptic(rank);
  if(rank==='mode')worldFx(false);
  if(rank==='confirm')worldFx(true);
}

function showOverlay(markup){
  panelBody.innerHTML=markup;
  game.classList.add('overlay-open');
  overlay.classList.add('is-open');
  overlay.setAttribute('aria-hidden','false');
}
function closeOverlay(){
  overlay.classList.remove('is-open');
  overlay.setAttribute('aria-hidden','true');
  setTimeout(()=>game.classList.remove('overlay-open'),140);
}
function showToast(t){
  toast.textContent=t;toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>toast.classList.remove('show'),1200);
}

document.querySelectorAll('.mode').forEach(b=>{
  b.onclick=perfWrap(()=>{
    controlFx(b,'mode');
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selected=b;
    title.textContent=b.dataset.title;
    sub.textContent=b.dataset.sub;
    game.classList.add('has');
  });
});

document.getElementById('open').onclick=perfWrap(()=>{
  if(!selected)return;
  controlFx(document.getElementById('open'),'enter');
  showOverlay(`<div class="panel-title">${selected.dataset.title}</div><div class="line"></div><p class="sub">${selected.dataset.sub}</p><p class="panel-copy">${modeDescriptions[selected.dataset.title]}</p><button class="start" id="startBattle">この合戦を始める <span class="arrow">›</span></button>`);
  const s=document.getElementById('startBattle');
  if(s)s.onclick=perfWrap(()=>{
    controlFx(s,'confirm');
    showToast('次工程：合戦本編へ接続');
  });
});

document.getElementById('back').onclick=perfWrap(()=>{
  controlFx(document.getElementById('back'),'soft');
  closeOverlay();
});

function settingsMarkup(){
  const on=k=>prefs[k]?' on':'';
  return `<div class="panel-title">設定</div><div class="line"></div><p class="panel-copy">HOMEからいつでも環境を整えられます。</p><div class="settings">
    <div class="setting"><span>UI効果音</span><button class="switch${on('sound')}" data-setting="sound" aria-pressed="${prefs.sound}"><i></i></button></div>
    <div class="setting"><span>画面演出</span><button class="switch${on('motion')}" data-setting="motion" aria-pressed="${prefs.motion}"><i></i></button></div>
    <div class="setting"><span>振動（対応端末）</span><button class="switch${on('haptic')}" data-setting="haptic" aria-pressed="${prefs.haptic}"><i></i></button></div>
  </div>`;
}

document.querySelectorAll('.util').forEach(b=>{
  b.onclick=perfWrap(()=>{
    controlFx(b,'soft');
    document.querySelectorAll('.util').forEach(x=>x.classList.toggle('active',x===b));
    const p=b.dataset.panel;
    if(p==='encyclopedia')showOverlay(`<div class="panel-title">妖怪図鑑</div><div class="line"></div><p class="panel-copy">妖怪を調べるためのHOME機能です。最終版では収集画面ではなく、確認・知識・出典情報へアクセスする図鑑として整備します。</p><div class="grid"><button class="tile"><strong>河童</strong><small>水辺に関わる妖怪。詳細データは後続実装。</small></button><button class="tile"><strong>天狗</strong><small>山地に関わる妖怪。詳細データは後続実装。</small></button><button class="tile"><strong>鬼</strong><small>複数の伝承を持つ妖怪。詳細データは後続実装。</small></button><button class="tile"><strong>妖狐</strong><small>伝承・能力・地域情報を確認する候補。</small></button></div>`);
    if(p==='records')showOverlay(`<div class="panel-title">戦績</div><div class="line"></div><p class="panel-copy">指揮者としての合戦記録を確認します。現在はUI試験用の仮値です。</p><div class="stats"><div class="stat"><b>0</b><span>完了した合戦</span></div><div class="stat"><b>0</b><span>勝利</span></div><div class="stat"><b>—</b><span>最終出陣</span></div></div>`);
    if(p==='settings')showOverlay(settingsMarkup());
  });
});

/* Dynamic panel controls: tiles and settings switches. */
panelBody.addEventListener('click',perfWrap(e=>{
  const sw=e.target.closest('.switch[data-setting]');
  if(sw){
    const key=sw.dataset.setting;
    prefs[key]=!prefs[key];
    savePrefs();
    sw.classList.toggle('on',prefs[key]);
    sw.setAttribute('aria-pressed',String(prefs[key]));
    if(key!=='sound' || prefs.sound)playUiSound('soft');
    haptic('soft');
    return;
  }
  const tile=e.target.closest('.tile');
  if(tile){
    controlFx(tile,'soft');
    showToast('図鑑詳細は後続実装');
  }
}));

/* Unlock audio on a real control touch without delaying the visual response. */
document.addEventListener('pointerdown',e=>{
  if(e.target.closest?.('button')?.closest('.game')) ensureAudio();
},{capture:true});


const titleScreen=document.getElementById('titleScreen');
const titleStart=document.getElementById('titleStart');
let titleLeaving=false;

function enterHomeFromTitle(){
  if(titleLeaving || !titleScreen || titleScreen.hidden)return;
  titleLeaving=true;

  /* Immediate feedback first; HOME reveal runs in parallel. */
  playUiSound('enter');
  haptic('soft');
  titleScreen.classList.add('is-leaving');
  game.classList.remove('title-active');
  game.classList.add('title-entering');

  setTimeout(()=>{
    titleScreen.hidden=true;
    titleScreen.setAttribute('aria-hidden','true');
    game.classList.remove('title-entering');
  },340);
}

if(titleStart){
  titleStart.addEventListener('click',perfWrap(enterHomeFromTitle));
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&overlay.classList.contains('is-open'))closeOverlay();
});
</script></body></html>

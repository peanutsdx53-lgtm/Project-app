<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT GitHub 更新テスト</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4ff;color:#172033}
    main{background:#fff;border:1px solid #b9c7e8;border-radius:16px;padding:32px;max-width:520px;width:min(88vw,520px);box-shadow:0 10px 28px rgba(70,90,130,.18);text-align:center}
    h1{font-size:1.6rem;margin:0 0 12px}
    p{line-height:1.7}
    button{font:inherit;padding:10px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}
    #count{font-weight:700}
    small{display:block;margin-top:20px;color:#59636e}
  </style>
</head>
<body>
  <main>
    <h1>GitHub Pages 更新テスト</h1>
    <p>ChatGPTからGitHub上のコードを更新しました。この表示になれば更新経路も正常です。</p>
    <p>ボタンを押した回数: <span id="count">0</span></p>
    <button id="button" type="button">+2</button>
    <small>Test version 2</small>
  </main>
  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('button').addEventListener('click', () => {
      count += 2;
      countEl.textContent = count;
    });
  </script>
</body>
</html>

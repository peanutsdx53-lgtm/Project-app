*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}
.game{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));overflow:hidden;background:radial-gradient(circle at 65% 35%,rgba(85,98,125,.32),transparent 30%),linear-gradient(160deg,#111927 0%,#07101c 45%,#020407 100%);border:1px solid rgba(214,183,120,.20);isolation:isolate}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.58),transparent 38%),linear-gradient(0deg,rgba(0,0,0,.72),transparent 40%);z-index:1}
.scene{position:absolute;inset:0;background:radial-gradient(ellipse at 62% 58%,rgba(255,210,120,.15),transparent 4%),radial-gradient(ellipse at 72% 46%,rgba(135,170,210,.12),transparent 12%),repeating-linear-gradient(90deg,transparent 0 5.5%,rgba(255,255,255,.025) 5.55% 5.7%,transparent 5.75% 7%);opacity:.8;z-index:0}
.home-ui{position:absolute;inset:0;z-index:3;transition:opacity .22s ease,transform .3s ease}
.game.overlay-open .home-ui{opacity:0;pointer-events:none;transform:scale(1.01)}
.copy{position:absolute;left:6.5%;top:13%;width:34%;opacity:0;transform:translateY(6px);transition:.3s ease}.game.has .copy{opacity:1;transform:none}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(28px,4.2vw,64px);letter-spacing:.09em;margin:0 0 12px;white-space:nowrap}.sub{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(12px,1.5vw,22px);letter-spacing:.12em;color:#d8c9ad;margin:0 0 14px}.line{width:90%;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:8px 0 12px}.mode-open{border:0;background:transparent;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(11px,1.2vw,18px);letter-spacing:.12em;padding:9px 30px 9px 0;cursor:pointer}.mode-open.pressing{background:linear-gradient(90deg,#efdcae,transparent);color:#18120a}

<body>
<div class="viewport"><main class="game title-active" id="game" data-world="neutral"><div class="scene" aria-hidden="true">
    <div class="world-layer world-neutral is-active" data-world-layer="neutral"></div>
    <div class="world-layer world-kanto" data-world-layer="kanto"></div>
    <div class="world-layer world-eastwest" data-world-layer="eastwest"></div>
    <div class="world-layer world-western" data-world-layer="western"></div>
    <div class="ambient-mist"></div>
    <div class="ambient-glow"></div>
  </div>

  <section class="title-screen" id="titleScreen" aria-label="YokaiBattlefield タイトル画面">
    <div class="title-copy" aria-hidden="true">
      <h1 class="title-logo">Yokai Battlefield</h1>
      <div class="title-rule"></div>
      <div class="title-tagline">あやかしの戦場は、まだ終わっていない</div>
    </div>
    <div class="title-prompt" aria-hidden="true"><span>画面をタップして始める</span><i></i></div>
    <div class="title-ripple" aria-hidden="true"></div>
    <button class="title-start" id="titleStart" type="button" aria-label="画面をタップして始める"></button>
  </section>

  <section class="home-ui">
    <section class="copy" id="copy"><h1 id="title">関東合戦</h1><div class="line"></div><p class="sub" id="sub">首都圏に広がる異変</p><button class="mode-open" id="open">この合戦を見る <span class="arrow">→</span></button></section>
    <nav class="rail" aria-label="合戦モード">
      <button class="mode" data-title="関東合戦" data-sub="首都圏に広がる異変" data-world="kanto">関東合戦</button>
      <button class="mode" data-title="東西合戦" data-sub="列島を分ける二つの妖勢" data-world="eastwest">東西合戦</button>
      <button class="mode" data-title="西洋妖怪決戦" data-sub="境界の外から来る妖異" data-world="western">西洋妖怪決戦</button>
    </nav>
    <nav class="utils" aria-label="ホーム機能">
      <button class="util" data-panel="encyclopedia">妖怪図鑑</button>
      <button class="util" data-panel="records">戦績</button>
      <button class="util" data-panel="settings">設定</button>
    </nav>
    <div class="build">GH TEST D11</div>
  </section>

  <section class="overlay" id="overlay" aria-hidden="true">
    <div class="panel"><button class="back" id="back">‹ ホームへ戻る</button>
      <div id="panelBody"></div>
    </div>
  </section>
  <div class="toast" id="toast"></div>
</main></div>
<script>
const APP_VERSION='D11';let updateCheckBusy=false;async function checkForAppUpdate(){if(updateCheckBusy)return;updateCheckBusy=true;try{const u=new URL('version.json',location.href);u.searchParams.set('_',Date.now());const r=await fetch(u,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)return;const v=await r.json();if(!v?.version||v.version===APP_VERSION)return;const c=new URL(location.href);c.searchParams.set('v',v.version);c.searchParams.set('_u',Date.now());setTimeout(()=>location.replace(c),120)}catch(e){}finally{updateCheckBusy=false}}window.addEventListener('pageshow',()=>setTimeout(checkForAppUpdate,250));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(checkForAppUpdate,180)});window.addEventListener('focus',()=>setTimeout(checkForAppUpdate,220));setInterval(()=>{if(document.visibilityState==='visible')checkForAppUpdate()},60000);
function insideGame(target){return !!(target&&target.closest&&target.closest('.game'))}['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>{if(insideGame(e.target))e.preventDefault()},{passive:false}));document.addEventListener('contextmenu',e=>{if(insideGame(e.target))e.preventDefault()});document.addEventListener('selectstart',e=>{if(insideGame(e.target)&&!e.target.closest('input,textarea,select'))e.preventDefault()});let pressedControl=null;document.addEventListener('pointerdown',e=>{const c=e.target.closest?.('button,[role="button"]');if(!c||!c.closest('.game'))return;pressedControl=c;c.classList.add('pressing')},{capture:true});function clearPressed(){if(pressedControl){pressedControl.classList.remove('pressing');pressedControl=null}}document.addEventListener('pointerup',clearPressed,{capture:true});document.addEventListener('pointercancel',clearPressed,{capture:true});window.addEventListener('blur',clearPressed);
const game=document.getElementById('game'),copy=document.getElementById('copy'),title=document.getElementById('title'),sub=document.getElementById('sub'),overlay=document.getElementById('overlay'),panelBody=document.getElementById('panelBody'),toast=document.getElementById('toast');let selected=null;const modeDescriptions={'関東合戦':'現代の首都圏に広がる異変を追う合戦モードです。','東西合戦':'列島を二分する妖怪勢力の大規模な衝突を扱います。','西洋妖怪決戦':'境界の外から来る異質な妖怪勢力との決戦です。'};const defaultPrefs={sound:true,motion:true,haptic:false};let prefs={...defaultPrefs};try{prefs={...defaultPrefs,...JSON.parse(localStorage.getItem('yb-ui-prefs')||'{}')}}catch(e){}function savePrefs(){try{localStorage.setItem('yb-ui-prefs',JSON.stringify(prefs))}catch(e){}game.classList.toggle('reduce-motion',!prefs.motion)}savePrefs();let audioCtx=null;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC({latencyHint:'interactive'})}catch(e){}function ensureAudio(){if(!prefs.sound)return null;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC({latencyHint:'interactive'})}if(audioCtx?.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}function tone(freq,dur,gain,type='sine',delay=0,ratio=1.1){const ctx=ensureAudio();if(!ctx)return;const now=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(45,freq*ratio),now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(ctx.destination);o.start(now);o.stop(now+dur+.02)}let lastUiSoundAt=0;function playUiSound(kind){if(!prefs.sound)return;const now=performance.now();if(kind!=='confirm'&&now-lastUiSoundAt<38)return;lastUiSoundAt=now;if(kind==='soft'){tone(430,.045,.012,'sine',0,1.03);return}if(kind==='mode'){tone(250,.085,.024,'sine',0,1.20);tone(520,.065,.008,'triangle',.012,1.08);return}if(kind==='enter'){tone(190,.12,.030,'triangle',0,1.24);tone(380,.09,.009,'sine',.018,1.10);return}if(kind==='confirm'){tone(145,.17,.038,'triangle',0,1.32);tone(292,.13,.014,'sine',.024,1.16);tone(580,.08,.006,'sine',.045,.96)}}function haptic(kind){if(!prefs.haptic)return;try{navigator.vibrate?.(kind==='confirm'?[14,24,12]:kind==='mode'?8:5)}catch(e){}}
window.__ybPerf={samples:[],maxHandlerMs:0,lastHandlerMs:0};function perfWrap(fn){return function(...args){const t0=performance.now(),result=fn.apply(this,args),ms=performance.now()-t0;window.__ybPerf.lastHandlerMs=ms;window.__ybPerf.maxHandlerMs=Math.max(window.__ybPerf.maxHandlerMs,ms);window.__ybPerf.samples.push(ms);if(window.__ybPerf.samples.length>120)window.__ybPerf.samples.shift();return result}}function retrigger(el,cls,ms=380){if(!el||!prefs.motion)return;const rk='_r'+cls,tk='_t'+cls;el.classList.remove(cls);cancelAnimationFrame(el[rk]||0);clearTimeout(el[tk]);el[rk]=requestAnimationFrame(()=>{el.classList.add(cls);el[tk]=setTimeout(()=>el.classList.remove(cls),ms)})}function worldFx(strong=false){if(!prefs.motion)return;const cls=strong?'confirm-fx':'world-fx';game.classList.remove(cls);requestAnimationFrame(()=>{game.classList.add(cls);setTimeout(()=>game.classList.remove(cls),strong?500:390)})}function controlFx(el,rank='soft'){retrigger(el,'fx',rank==='confirm'?500:360);playUiSound(rank);haptic(rank);if(rank==='mode')worldFx(false);if(rank==='confirm')worldFx(true)}function showOverlay(markup){panelBody.innerHTML=markup;game.classList.add('overlay-open');overlay.classList.add('is-open');overlay.setAttribute('aria-hidden','false')}function closeOverlay(){overlay.classList.remove('is-open');overlay.setAttribute('aria-hidden','true');setTimeout(()=>game.classList.remove('overlay-open'),140)}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1200)}
const worldLayers=[...document.querySelectorAll('[data-world-layer]')];
let activeWorld='neutral';
let worldSwapTimer=0;
function setWorldScene(nextWorld){
  if(!nextWorld || nextWorld===activeWorld)return;
  const next=worldLayers.find(x=>x.dataset.worldLayer===nextWorld);
  const current=worldLayers.find(x=>x.dataset.worldLayer===activeWorld);
  if(!next)return;
  clearTimeout(worldSwapTimer);
  next.classList.add('is-active');
  requestAnimationFrame(()=>{if(current)current.classList.remove('is-active')});
  activeWorld=nextWorld;
  game.dataset.world=nextWorld;
  worldSwapTimer=setTimeout(()=>worldLayers.forEach(layer=>{if(layer!==next)layer.classList.remove('is-active')}),760);
}

document.querySelectorAll('.mode').forEach(b=>{
  b.onclick=perfWrap(()=>{
    controlFx(b,'mode');
    setWorldScene(b.dataset.world);
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selected=b;
    title.textContent=b.dataset.title;
    sub.textContent=b.dataset.sub;
    game.classList.add('has');
  });
});

document.getElementById('open').onclick=perfWrap(()=>{
  if(!selected)return;
  controlFx(document.getElementById('open'),'enter');
  showOverlay(`<div class="panel-title">${selected.dataset.title}</div><div class="line"></div><p class="sub">${selected.dataset.sub}</p><p class="panel-copy">${modeDescriptions[selected.dataset.title]}</p><button class="start" id="startBattle">この合戦を始める <span class="arrow">›</span></button>`);
  const s=document.getElementById('startBattle');
  if(s)s.onclick=perfWrap(()=>{
    controlFx(s,'confirm');
    showToast('次工程：合戦本編へ接続');
  });
});

document.getElementById('back').onclick=perfWrap(()=>{
  controlFx(document.getElementById('back'),'soft');
  closeOverlay();
});

function settingsMarkup(){
  const on=k=>prefs[k]?' on':'';
  return `<div class="panel-title">設定</div><div class="line"></div><p class="panel-copy">HOMEからいつでも環境を整えられます。</p><div class="settings">
    <div class="setting"><span>UI効果音</span><button class="switch${on('sound')}" data-setting="sound" aria-pressed="${prefs.sound}"><i></i></button></div>
    <div class="setting"><span>画面演出</span><button class="switch${on('motion')}" data-setting="motion" aria-pressed="${prefs.motion}"><i></i></button></div>
    <div class="setting"><span>振動（対応端末）</span><button class="switch${on('haptic')}" data-setting="haptic" aria-pressed="${prefs.haptic}"><i></i></button></div>
  </div>`;
}

document.querySelectorAll('.util').forEach(b=>{
  b.onclick=perfWrap(()=>{
    controlFx(b,'soft');
    document.querySelectorAll('.util').forEach(x=>x.classList.toggle('active',x===b));
    const p=b.dataset.panel;
    if(p==='encyclopedia')showOverlay(`<div class="panel-title">妖怪図鑑</div><div class="line"></div><p class="panel-copy">妖怪を調べるためのHOME機能です。最終版では収集画面ではなく、確認・知識・出典情報へアクセスする図鑑として整備します。</p><div class="grid"><button class="tile"><strong>河童</strong><small>水辺に関わる妖怪。詳細データは後続実装。</small></button><button class="tile"><strong>天狗</strong><small>山地に関わる妖怪。詳細データは後続実装。</small></button><button class="tile"><strong>鬼</strong><small>複数の伝承を持つ妖怪。詳細データは後続実装。</small></button><button class="tile"><strong>妖狐</strong><small>伝承・能力・地域情報を確認する候補。</small></button></div>`);
    if(p==='records')showOverlay(`<div class="panel-title">戦績</div><div class="line"></div><p class="panel-copy">指揮者としての合戦記録を確認します。現在はUI試験用の仮値です。</p><div class="stats"><div class="stat"><b>0</b><span>完了した合戦</span></div><div class="stat"><b>0</b><span>勝利</span></div><div class="stat"><b>—</b><span>最終出陣</span></div></div>`);
    if(p==='settings')showOverlay(settingsMarkup());
  });
});

panelBody.addEventListener('click',perfWrap(e=>{
  const sw=e.target.closest('.switch[data-setting]');
  if(sw){
    const key=sw.dataset.setting;
    prefs[key]=!prefs[key];
    savePrefs();
    sw.classList.toggle('on',prefs[key]);
    sw.setAttribute('aria-pressed',String(prefs[key]));
    if(key!=='sound'||prefs.sound)playUiSound('soft');
    haptic('soft');
    return;
  }
  const tile=e.target.closest('.tile');
  if(tile){controlFx(tile,'soft');showToast('図鑑詳細は後続実装');}
}));

document.addEventListener('pointerdown',e=>{if(e.target.closest?.('button')?.closest('.game'))ensureAudio()},{capture:true});
let titleReadyScheduled=false;function scheduleTitleReady(){if(titleReadyScheduled)return;if(window.innerWidth<=window.innerHeight)return;titleReadyScheduled=true;requestAnimationFrame(()=>requestAnimationFrame(()=>game.classList.add('title-ready')))}scheduleTitleReady();window.addEventListener('resize',()=>{if(!game.classList.contains('title-ready')){titleReadyScheduled=false;scheduleTitleReady()}},{passive:true});window.addEventListener('orientationchange',()=>{if(!game.classList.contains('title-ready')){titleReadyScheduled=false;setTimeout(scheduleTitleReady,40)}},{passive:true});
const titleScreen=document.getElementById('titleScreen'),titleStart=document.getElementById('titleStart');let titleLeaving=false;titleStart.addEventListener('pointerdown',e=>{if(titleLeaving)return;const r=titleScreen.getBoundingClientRect();titleScreen.style.setProperty('--tap-x',((e.clientX-r.left)/r.width*100)+'%');titleScreen.style.setProperty('--tap-y',((e.clientY-r.top)/r.height*100)+'%');titleScreen.classList.remove('tap-fx');requestAnimationFrame(()=>titleScreen.classList.add('tap-fx'))});titleStart.addEventListener('click',()=>{if(titleLeaving)return;titleLeaving=true;playUiSound('enter');titleScreen.classList.add('is-leaving');game.classList.remove('title-active');game.classList.add('title-entering');setTimeout(()=>{titleScreen.hidden=true;game.classList.remove('title-entering')},330)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('is-open'))closeOverlay()});
</script></body></html>
